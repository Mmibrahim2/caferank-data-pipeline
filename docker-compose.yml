services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caferank
      POSTGRES_PASSWORD: caferank
      POSTGRES_DB: caferank
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caferank"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

