[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "caferank"
version = "0.1.0"
description = "ETL pipeline for ranking Minneapolis cafe neighborhoods"
requires-python = ">=3.10"
dependencies = [
  "boto3>=1.34,<2",
  "pandas>=2.2,<3",
  "psycopg[binary]>=3.1,<4",
  "requests>=2.31,<3",
  "SQLAlchemy>=2.0,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[project.scripts]
caferank = "caferank.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
