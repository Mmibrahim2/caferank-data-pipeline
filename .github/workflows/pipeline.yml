name: CafeRank pipeline

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check src tests
      - run: pytest --cov=caferank --cov-report=term-missing

  run-pipeline:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip }
      - run: pip install .
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: Read database connection secret
        run: echo "DATABASE_URL=$(aws secretsmanager get-secret-value --secret-id '${{ secrets.DB_SECRET_ARN }}' --query SecretString --output text)" >> "$GITHUB_ENV"
      - name: Allow this runner to reach PostgreSQL
        id: database-firewall
        run: |
          RUNNER_IP=$(curl --fail --silent https://checkip.amazonaws.com)
          echo "runner_ip=$RUNNER_IP" >> "$GITHUB_OUTPUT"
          aws ec2 authorize-security-group-ingress \
            --group-id '${{ vars.DB_SECURITY_GROUP_ID }}' \
            --protocol tcp --port 5432 --cidr "$RUNNER_IP/32"
      - name: Run ETL
        env:
          SOURCE_URL: ${{ vars.SOURCE_URL }}
          SOURCE_FILE: data/sample_cafes.csv
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: caferank run
      - name: Remove runner database access
        if: always() && steps.database-firewall.outputs.runner_ip != ''
        run: |
          aws ec2 revoke-security-group-ingress \
            --group-id '${{ vars.DB_SECURITY_GROUP_ID }}' \
            --protocol tcp --port 5432 \
            --cidr '${{ steps.database-firewall.outputs.runner_ip }}/32'
